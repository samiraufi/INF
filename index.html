<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Advertisements</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            color: white;
            margin: 0;
        }
        .ad-container {
            text-align: center;
            padding: 40px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 20px;
            backdrop-filter: blur(10px);
            border: 2px solid rgba(255, 255, 255, 0.2);
            max-width: 90%;
        }
        .ad-container h1 {
            font-size: 32px;
            margin-bottom: 10px;
        }
        .ad-container p {
            font-size: 18px;
            opacity: 0.9;
        }
        .ad-container .special {
            font-size: 24px;
            font-weight: bold;
            color: #ffd700;
            margin: 15px 0;
        }
        .ad-container .button {
            display: inline-block;
            padding: 12px 30px;
            background: #ffd700;
            color: #2d3748;
            border-radius: 10px;
            text-decoration: none;
            font-weight: bold;
            margin-top: 15px;
            transition: transform 0.3s ease;
        }
        .ad-container .button:hover {
            transform: scale(1.05);
        }
        .footer {
            position: fixed;
            bottom: 20px;
            right: 30px;
            color: rgba(255, 255, 255, 0.3);
            font-size: 12px;
        }
    </style>
</head>
<body>
    <div class="ad-container">
        <h1>🎉 Special Offer!</h1>
        <p>Get 50% Off on Internet Packages</p>
        <div class="special">Limited Time Offer</div>
        <p>Use Code: <strong style="color:#ffd700;">ISP50</strong></p>
        <a href="#" class="button">Claim Now →</a>
        <p style="margin-top:15px;font-size:14px;opacity:0.7;">Valid until December 31, 2026</p>
    </div>
    <div class="footer">v1.0 | ISP Ads</div>
</body>
</html>
